name: Publish Maven Central

on:
  push:
    tags:
      - "v0.3.0"

concurrency:
  group: publish-maven-central-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify stable release identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "v0.3.0" ]]; then
            echo "Only the exact stable tag v0.3.0 may publish." >&2
            exit 1
          fi

          version="$(sed -n 's/^POM_VERSION_NAME=//p' gradle.properties)"
          if [[ "${version}" != "0.3.0" || "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "POM_VERSION_NAME must be stable 0.3.0 and match v0.3.0." >&2
            exit 1
          fi

      - name: Run release gate
        run: ./gradlew verifyMavenCentralConfig mviReleaseCheck --stacktrace
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

      - name: Upload performance report
        if: ${{ always() && hashFiles('build/reports/performance/pulse-performance.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pulse-release-performance-report
          path: build/reports/performance/pulse-performance.json

  publish:
    needs: release-check
    if: github.ref_type == 'tag' && github.ref_name == 'v0.3.0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish and release to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
