name: Android Device

on:
  push:
  pull_request:

concurrency:
  group: android-device-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run managed-device instrumentation
        run: >-
          ./gradlew mviAndroidDeviceCheck --stacktrace
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload managed-device results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pulse-managed-device-results
          if-no-files-found: ignore
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
