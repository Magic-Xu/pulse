name: Stress and Performance

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stress-and-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Run stress and performance gates
        run: >-
          ./gradlew
          :mvi-testing:multiSeedStressCheck
          :mvi-benchmarks:performanceRegressionCheck
          --stacktrace

      - name: Upload performance report
        if: ${{ always() && hashFiles('build/reports/performance/pulse-performance.json') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pulse-performance-report
          path: build/reports/performance/pulse-performance.json
