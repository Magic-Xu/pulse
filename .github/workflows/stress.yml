name: Stress and Performance

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stress-and-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run stress and performance gates
        run: >-
          ./gradlew
          :mvi-testing:multiSeedStressCheck
          :mvi-benchmarks:performanceRegressionCheck
          --stacktrace

      - name: Upload performance report
        if: ${{ always() && hashFiles('build/reports/performance/pulse-performance.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pulse-performance-report
          path: build/reports/performance/pulse-performance.json
